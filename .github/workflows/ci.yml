name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Dev tooling (vitest 5) needs Node >= 22.12; the shipped CLI/Action
        # support Node >= 20, which the `runtime-node20` job verifies.
        os: [ubuntu-latest]
        node: [22, 24]
        include:
          - os: windows-latest
            node: 22
          - os: macos-latest
            node: 22
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run build
      - name: Committed bundles are up to date
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: |
          git diff --exit-code -- dist/action.cjs docs/assets/planlens.js docs/rules.md docs/rules.html || {
            echo "::error::Generated files are stale (dist/action.cjs, docs/assets/planlens.js, docs/rules.md). Run 'npm run build' and commit the result."
            exit 1
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        with:
          name: dist
          path: dist/

  runtime-node20:
    name: runtime smoke (node 20)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
      - name: CLI works on the minimum supported Node
        run: |
          node --version
          node dist/cli.mjs --version
          node dist/cli.mjs test/fixtures/real/noop.json
          set +e
          node dist/cli.mjs test/fixtures/real/aws-create.json --format sarif -o /tmp/p.sarif
          code=$?
          set -e
          test "$code" = "1"
          test -s /tmp/p.sarif
          node --input-type=module -e "const m = await import('./dist/index.mjs'); if (m.RULES.length < 40) process.exit(1)"

  e2e:
    name: e2e (real terraform ${{ matrix.terraform }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        terraform: ["1.5.7", "1.9.8", "latest"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ matrix.terraform }}
          terraform_wrapper: false
      - run: npm ci
      - run: npm run build
      - name: Generate plans with real Terraform and compare binary vs JSON findings
        # lifecycle uses import/removed blocks (Terraform >= 1.7), so only aws-create runs on 1.5
        run: |
          if [ "${{ matrix.terraform }}" = "1.5.7" ]; then
            E2E_BINARY=1 node scripts/gen-fixtures.mjs aws-create noop
          else
            E2E_BINARY=1 node scripts/gen-fixtures.mjs
          fi
      - name: Regenerated fixtures still pass the test suite
        run: npx vitest run test/core/engine.test.ts test/core/plan.test.ts

  action:
    name: action (dogfood)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run planlens action from this commit
        id: planlens
        uses: ./
        with:
          plan: |
            test/fixtures/real/aws-create.json
            test/fixtures/real/lifecycle.json
          fail-on: none
          comment: ${{ github.event.pull_request.head.repo.full_name == github.repository && 'always' || 'never' }}
          comment-id: dogfood
      - name: Check outputs
        env:
          PASSED: ${{ steps.planlens.outputs.passed }}
          SCORE: ${{ steps.planlens.outputs.risk-score }}
          CRITICAL: ${{ steps.planlens.outputs.critical }}
        run: |
          echo "passed=$PASSED score=$SCORE critical=$CRITICAL"
          test "$PASSED" = "true"
          test "$SCORE" = "100"
          test "$CRITICAL" -gt 0
          test -s planlens.sarif && test -s planlens.json && test -s planlens.md
      - name: Gate must fail on critical findings
        id: gate
        continue-on-error: true
        uses: ./
        with:
          plan: test/fixtures/real/aws-create.json
          fail-on: critical
          comment: never
          step-summary: "false"
      - name: Assert gate failed
        env:
          OUTCOME: ${{ steps.gate.outcome }}
        run: test "$OUTCOME" = "failure"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: planlens-reports
          path: |
            planlens.sarif
            planlens.json
            planlens.md

  docker:
    name: docker image (build + smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: planlens:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the image
        run: |
          docker run --rm planlens:ci --version
          docker run --rm -v "$PWD:/work:ro" planlens:ci test/fixtures/real/noop.json
          set +e
          docker run --rm -v "$PWD:/work:ro" planlens:ci test/fixtures/real/aws-create.json --format json > out.json
          code=$?
          set -e
          test "$code" = "1"
          node -e "const r=require('./out.json'); if (r.reports[0].level!=='critical') process.exit(1)"
          test "$(docker run --rm --entrypoint id planlens:ci -u)" != "0"
