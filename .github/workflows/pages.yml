name: pages

# Deploys docs/ to https://yousafkhamza.github.io/planlens/
# Repo setting required: Settings → Pages → Source: "GitHub Actions".
on:
  push:
    branches: [main]
    paths: ["docs/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Sanity check site files
        run: |
          for f in docs/index.html docs/app.js docs/styles.css docs/assets/planlens.js docs/samples/prod-change.json; do
            test -s "$f" || { echo "::error::missing $f"; exit 1; }
          done
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: false
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Smoke test the live site
        env:
          URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$URL") && [ "$code" = "200" ] && break
            sleep 10
          done
          echo "$URL → $code"
          test "$code" = "200"
          curl -sf "${URL%/}/assets/planlens.js" -o /dev/null
          curl -sf "${URL%/}/samples/prod-change.json" -o /dev/null
