# .github/workflows/terraform-pr.yml
# Plan on every PR, review the plan with planlens, comment on the PR,
# show findings in the Security tab, and block merges on high/critical risk.
name: terraform-pr

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled] # labeled → re-run after "planlens:accept-risk"
    paths: ["infra/**"]

permissions:
  contents: read
  id-token: write # OIDC to AWS — no static keys
  pull-requests: write # sticky PR comment
  security-events: write # SARIF upload

jobs:
  plan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: aws-actions/configure-aws-credentials@<pin-a-sha> # vX
        with:
          role-to-assume: arn:aws:iam::123456789012:role/terraform-plan-readonly
          aws-region: eu-west-1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - run: terraform init -input=false
      - run: terraform plan -input=false -lock=false -out=tf.plan
      - run: terraform show -json tf.plan > plan.json

      - name: Review plan
        uses: yousafkhamza/planlens@v1
        with:
          plan: infra/plan.json
          source-dir: infra # maps findings to .tf lines in the PR diff
          fail-on: high

      - name: Upload findings to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: planlens.sarif
          category: planlens
